spring.application.name=encurtador-de-links
server.port=9090

# Endereço usado para montar os links curtos devolvidos pela API
app.base-url=${APP_BASE_URL:http://localhost:9090}

# Banco de dados. Sem variáveis de ambiente, sobe com H2 em memória.
# Para PostgreSQL, defina DATABASE_URL, DATABASE_USERNAME e DATABASE_PASSWORD.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:encurtador}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
